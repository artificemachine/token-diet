[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rtk-mcp"
version = "0.1.0"
description = "MCP server exposing rtk (Rust Token Killer) CLI subcommands as tools"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
rtk-mcp = "rtk_mcp.server:main"
