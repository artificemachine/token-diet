---
# =============================================================================
# token-diet — AI Context Optimization Stack
# Serena + ICM + Context7 installer for Linux and macOS remote hosts
#
# Usage:
#   ansible-playbook -i inventory.ini scripts/playbook.yml
#
#   # Install all tools (online, default):
#   ansible-playbook -i inventory.ini scripts/playbook.yml
#
#   # Install from local forks (air-gap / offline):
#   ansible-playbook -i inventory.ini scripts/playbook.yml \
#     --extra-vars "install_mode=local"
#
#   # Install only Serena, skip ICM and Context7:
#   ansible-playbook -i inventory.ini scripts/playbook.yml \
#     --extra-vars "install_icm=false install_context7=false"
#
#   # Skip Claude Code hook/MCP configuration:
#   ansible-playbook -i inventory.ini scripts/playbook.yml \
#     --extra-vars "configure_claude=false"
#
#   # Run prerequisite checks only:
#   ansible-playbook -i inventory.ini scripts/playbook.yml --tags prereqs
#
#   # Verify installed versions only:
#   ansible-playbook -i inventory.ini scripts/playbook.yml --tags verify
#
# Requirements:
#   - Ansible >= 2.14
#   - SSH access to target hosts
#   - Internet access (online mode) or token-diet repo already cloned (local mode)
# =============================================================================

- name: token-diet — AI Context Optimization Stack (Serena + ICM + Context7)
  hosts: all
  gather_facts: true
  become: false

  vars:
    # -------------------------------------------------------------------------
    # Repository configuration
    # -------------------------------------------------------------------------
    token_diet_repo: "https://github.com/artificemachine/token-diet"
    token_diet_dest: "{{ ansible_env.HOME }}/token-diet"

    # -------------------------------------------------------------------------
    # Install mode: "online" (default) or "local" (use forks/ submodules)
    # Override: --extra-vars "install_mode=local"
    # -------------------------------------------------------------------------
    install_mode: online

    # -------------------------------------------------------------------------
    # Tool selection — set any to false to skip that tool
    # Override: --extra-vars "install_serena=false"
    # -------------------------------------------------------------------------
    install_serena: true
    install_icm: true
    install_context7: true

    # -------------------------------------------------------------------------
    # Context7 — remote HTTP MCP server (no local binary)
    # Override: --extra-vars "context7_url=https://internal.gateway/mcp"
    # -------------------------------------------------------------------------
    context7_url: "https://mcp.context7.com/mcp"

    # -------------------------------------------------------------------------
    # Claude Code integration — set false to skip hook/MCP registration
    # -------------------------------------------------------------------------
    configure_claude: true

    # -------------------------------------------------------------------------
    # Derived paths (do not override)
    # -------------------------------------------------------------------------
    cargo_bin: "{{ ansible_env.HOME }}/.cargo/bin"
    local_bin: "{{ ansible_env.HOME }}/.local/bin"

  # ---------------------------------------------------------------------------
  # Environment applied to all cargo / uv tasks
  # ---------------------------------------------------------------------------
  environment:
    PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"

  handlers:
    - name: Reload PATH
      ansible.builtin.debug:
        msg: >
          PATH has been updated. If running interactively, source your shell profile:
          source ~/.bashrc  (Linux) or source ~/.zshrc  (macOS)

  # ===========================================================================
  # TASKS
  # ===========================================================================
  tasks:

    # =========================================================================
    # PREREQUISITES
    # =========================================================================

    - name: Prereqs | Check that git is installed
      ansible.builtin.command: git --version
      register: git_check
      changed_when: false
      failed_when: git_check.rc != 0
      tags: [prereqs]

    - name: Prereqs | Fail with helpful message if git is missing
      ansible.builtin.fail:
        msg: >
          git is required but was not found on {{ inventory_hostname }}.
          Install git before running this playbook:
            Linux (Debian/Ubuntu): sudo apt-get install -y git
            Linux (RHEL/Fedora):   sudo dnf install -y git
            macOS:                 brew install git
      when: git_check.rc is defined and git_check.rc != 0
      tags: [prereqs]

    # --- Rust / Cargo ---------------------------------------------------------

    - name: Prereqs | Check if rustc is already installed
      ansible.builtin.stat:
        path: "{{ cargo_bin }}/rustc"
      register: rustc_stat
      when: install_icm
      tags: [prereqs]

    - name: Prereqs | Install Rust via rustup (if not present)
      ansible.builtin.shell: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
        | sh -s -- -y --default-toolchain stable --no-modify-path
      args:
        creates: "{{ cargo_bin }}/rustc"
      when:
        - install_icm
        - not rustc_stat.stat.exists
      notify: Reload PATH
      tags: [prereqs]

    - name: Prereqs | Ensure Rust stable toolchain is up to date
      ansible.builtin.command: >
        {{ cargo_bin }}/rustup update stable --no-self-update
      changed_when: false
      failed_when: false
      when: install_icm
      tags: [prereqs]

    # --- uv -------------------------------------------------------------------

    - name: Prereqs | Check if uv is already installed
      ansible.builtin.stat:
        path: "{{ local_bin }}/uv"
      register: uv_stat
      when: install_serena
      tags: [prereqs]

    - name: Prereqs | Install uv (if not present)
      ansible.builtin.shell: curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        creates: "{{ local_bin }}/uv"
      when:
        - install_serena
        - not uv_stat.stat.exists
      notify: Reload PATH
      tags: [prereqs]

    # --- Clone token-diet repo ------------------------------------------------

    - name: Prereqs | Clone or update token-diet repository
      ansible.builtin.git:
        repo: "{{ token_diet_repo }}"
        dest: "{{ token_diet_dest }}"
        update: true
        force: false
      register: repo_clone
      tags: [prereqs]

    - name: Prereqs | Update git submodules (forks/serena, forks/icm)
      ansible.builtin.command:
        cmd: git submodule update --init --recursive
        chdir: "{{ token_diet_dest }}"
      changed_when: false
      tags: [prereqs]

    # =========================================================================
    # ICM
    # =========================================================================

    - name: ICM | Install from git (online mode)
      ansible.builtin.command: >
        {{ cargo_bin }}/cargo install
        --git https://github.com/artificemachine/icm
        icm-cli
        --force
      register: icm_install_online
      changed_when: >
        'Installed' in icm_install_online.stderr or
        'Compiling' in icm_install_online.stderr
      when:
        - install_icm
        - install_mode == 'online'
      tags: [icm]

    - name: ICM | Install from local fork (offline mode)
      ansible.builtin.command: >
        {{ cargo_bin }}/cargo install
        --path {{ token_diet_dest }}/forks/icm/crates/icm-cli
        --no-default-features
        --features tui,backend-sqlite
        --force
      register: icm_install_local
      changed_when: >
        'Installed' in icm_install_local.stderr or
        'Compiling' in icm_install_local.stderr
      when:
        - install_icm
        - install_mode == 'local'
      tags: [icm]

    - name: ICM | Register MCP server for Claude Code
      ansible.builtin.command: >
        claude mcp add --scope user icm --
        icm serve --compact
      register: icm_mcp
      changed_when: >
        'added' in icm_mcp.stdout | lower or
        'registered' in icm_mcp.stdout | lower
      failed_when: false
      when:
        - install_icm
        - configure_claude
      tags: [icm]

    - name: ICM | Verify installation
      ansible.builtin.command: "{{ cargo_bin }}/icm --version"
      register: icm_version
      changed_when: false
      failed_when: icm_version.rc != 0
      when: install_icm
      tags: [icm, verify]

    - name: ICM | Confirm version
      ansible.builtin.debug:
        msg: "ICM installed OK: {{ icm_version.stdout | default('(no output)') }}"
      when: install_icm
      tags: [icm, verify]

    # =========================================================================
    # Serena
    # =========================================================================

    - name: Serena | Verify uvx can fetch and launch Serena (online probe)
      ansible.builtin.command: >
        {{ local_bin }}/uvx
        --from git+https://github.com/artificemachine/serena
        serena --help
      register: serena_probe
      changed_when: false
      failed_when: false
      when: install_serena
      tags: [serena]

    - name: Serena | Warn if Serena probe failed
      ansible.builtin.debug:
        msg: >
          WARNING: Serena probe via uvx returned rc={{ serena_probe.rc }}.
          Serena may not be available or the network is restricted.
          Claude Code MCP registration will still be attempted.
      when:
        - install_serena
        - serena_probe.rc is defined
        - serena_probe.rc != 0
      tags: [serena]

    - name: Serena | Register MCP server for Claude Code
      ansible.builtin.command: >
        claude mcp add --scope user serena --
        uvx --from git+https://github.com/artificemachine/serena
        serena start-mcp-server
        --context=claude-code --project-from-cwd
      register: serena_mcp
      changed_when: >
        'added' in serena_mcp.stdout | lower or
        'registered' in serena_mcp.stdout | lower
      failed_when: false
      when:
        - install_serena
        - configure_claude
      tags: [serena]

    - name: Serena | Verify uv is available (required at runtime)
      ansible.builtin.command: "{{ local_bin }}/uv --version"
      register: uv_version
      changed_when: false
      failed_when: uv_version.rc != 0
      when: install_serena
      tags: [serena, verify]

    - name: Serena | Confirm uv version
      ansible.builtin.debug:
        msg: "uv available: {{ uv_version.stdout | default('(no output)') }}"
      when: install_serena
      tags: [serena, verify]

    # =========================================================================
    # Context7
    # =========================================================================

    - name: Context7 | Register HTTP MCP server for Claude Code
      ansible.builtin.command: >
        claude mcp add --scope user --transport http context7 {{ context7_url }}
      register: context7_mcp
      changed_when: >
        'added' in context7_mcp.stdout | lower or
        'registered' in context7_mcp.stdout | lower
      failed_when: false
      when:
        - install_context7
        - configure_claude
      tags: [context7]

    - name: Context7 | Verify registration for Claude Code
      ansible.builtin.command: claude mcp get context7
      register: context7_verify
      changed_when: false
      failed_when: false
      when:
        - install_context7
        - configure_claude
      tags: [context7, verify]

    - name: Context7 | Confirm registration
      ansible.builtin.debug:
        msg:
          url: "{{ context7_url }}"
          registered: "{{ context7_verify.rc is defined and context7_verify.rc == 0 }}"
          config_block: "{{ {'mcpServers': {'context7': {'type': 'http', 'url': context7_url}}} }}"
      when: install_context7
      tags: [context7, verify]

    # =========================================================================
    # SUMMARY
    # =========================================================================

    - name: Summary | Collect installed tool versions
      ansible.builtin.command: "{{ item.cmd }}"
      loop:
        - name: ICM
          cmd: "{{ cargo_bin }}/icm --version"
          enabled: "{{ install_icm }}"
        - name: uv
          cmd: "{{ local_bin }}/uv --version"
          enabled: "{{ install_serena }}"
        - name: Context7
          cmd: claude mcp get context7
          enabled: "{{ install_context7 and configure_claude }}"
      when: item.enabled | bool
      register: summary_versions
      failed_when: false
      changed_when: false
      tags: [verify, summary]

    - name: Summary | Print installed versions
      ansible.builtin.debug:
        msg: >
          {{ item.item.name }}: {{ item.stdout | default('not installed / error') }}
      loop: "{{ summary_versions.results }}"
      when: item.item.enabled | bool
      loop_control:
        label: "{{ item.item.name }}"
      tags: [verify, summary]

    - name: Summary | token-diet installation complete
      ansible.builtin.debug:
        msg: |
          ============================================================
          token-diet installation complete on {{ inventory_hostname }}
          ============================================================
          install_mode     : {{ install_mode }}
          install_serena   : {{ install_serena }}
          install_icm      : {{ install_icm }}
          install_context7 : {{ install_context7 }}
          configure_claude : {{ configure_claude }}
          context7_url     : {{ context7_url }}
          repo cloned to   : {{ token_diet_dest }}
          ============================================================
          Next steps:
            1. Open a new shell (or source ~/.bashrc / ~/.zshrc) to
               pick up updated PATH entries.
            2. Run: icm --version
            3. Run: claude mcp get context7   (confirm HTTP MCP registration)
            4. In a Claude Code session: recall a stored fact via ICM and
               pull current library docs via Context7.
          ============================================================
      tags: [verify, summary]
